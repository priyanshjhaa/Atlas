name: Atlas quality gates

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: atlas-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BETTER_AUTH_SECRET: ci-only-secret-with-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:3000
      BACKEND_URL: http://localhost:4000
      DATABASE_URL: postgresql://atlas:atlas@localhost:5432/atlas
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  browser-acceptance:
    name: Browser acceptance
    runs-on: ubuntu-latest
    needs: frontend
    timeout-minutes: 20
    env:
      BETTER_AUTH_SECRET: ci-only-secret-with-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:3000
      BACKEND_URL: http://localhost:4000
      DATABASE_URL: postgresql://atlas:atlas@localhost:5432/atlas
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run functional and visual browser acceptance
        run: npm run test:e2e
      - name: Run Lighthouse accessibility checks
        run: npm run test:lighthouse
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-acceptance-diagnostics
          path: |
            playwright-report
            test-results
            .lighthouseci
          include-hidden-files: true
          if-no-files-found: ignore

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run acceptance:rate-limit
      - run: npm run build

  production-containers:
    name: Production containers
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/operations/container-acceptance.sh
